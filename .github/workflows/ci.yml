name: CI

# Run teh quality gates whenever code is pushed to the repository
# or when a pull request proposes changes.
on:
  push:
  pull_request:

# The CI workflow only needs permission to read repository contents.
permissions:
  contents: read

jobs:
  quality:
    name: Tests and Code Quality
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the temporary GitHub-hosted runner.
      - name: Check out repository
        uses: actions/checkout@v7

      # Install the same Python major/minor version used by the project.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      # Upgrade pip itself before installing the locked environment.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Install the exact development dependency versions recorded in
      # requirements-dev.lock.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      # Install the Local AI Router package iteself.
      #
      # Dependencies have already been installed from the lock file
      # so --no-deps prevents pip from resolving them a second time.
      - name: Install Local AI Router
        run: python -m pip install -e . --no-deps

      # Verify that the resolved dependency graph is internally valid.
      - name: Check dependency consistency
        run: python -m pip check

      # Reject code containing configured Ruff lint violations.
      - name: Run Ruff lint checks
        run: ruff check src tests

      # Reject Python files that have not been formatted consistently.
      #
      # --check means CI reports formatting differences without rewritting files.
      - name: Check Ruff formatting
        run: ruff format --check src tests

      # Run the normal deterministic test suite.
      #
      # pyproject.toml limits normal pytest discovery to tests/,
      # so real Ollama/GPU smoke tests are not executed in CI.
      - name: Run automated tests
        run: python -m pytest -v