[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-router"
version = "0.2.0"
description = "Local routing layer for AI models and services."
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pip-tools",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]